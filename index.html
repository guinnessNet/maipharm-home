<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#184230" />
    
    <!-- Route titles, canonical, social metadata and JSON-LD are owned by Helmet.
         The production build writes them into each prerendered HTML document. -->
    <!-- 파비콘 및 아이콘 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- PWA 관련 메타 태그 -->
    <link rel="manifest" href="/site.webmanifest" type="application/manifest+json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="마이팜" />
    
    <!-- DNS Prefetch 및 Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- 성능 최적화를 위한 메타 태그 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- 보안 헤더 -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  </head>
  <body>
    <div id="root"></div>

    <!-- GitHub Pages SPA 리다이렉트 처리 -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- 메인 애플리케이션 스크립트 -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZMXE35L4DQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZMXE35L4DQ', {
        'page_location': window.location.href
      });
    </script>
    
    <!-- 성능 모니터링 -->
    <script>
      // Core Web Vitals 모니터링
      if ('performance' in window) {
        window.addEventListener('load', function() {
          setTimeout(function() {
            const perfData = performance.getEntriesByType('navigation')[0];
            if (perfData) {
              gtag('event', 'timing_complete', {
                'name': 'load',
                'value': Math.round(perfData.loadEventEnd - perfData.loadEventStart)
              });
            }
          }, 0);
        });
      }
    </script>
  </body>
</html>
