<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>멜로디 스케치 광고</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { display: flex; justify-content: center; }
</style>
</head>
<body>
<!-- 쿠팡 파트너스 다이나믹 배너(번호 1060104, 320x100). 배너 코드는 쿠팡이 준 그대로 둔다. -->
<script src="https://ads-partners.coupang.com/g.js"></script> <script> new PartnersCoupang.G({"id":1060104,"template":"carousel","trackingCode":"AF4562829","width":"320","height":"100","tsource":""}); </script>
<!--
  멜로디 스케치 앱과의 약속(바꾸지 않는다): 배너가 만든 iframe(또는 img)의 로드가 끝나면 앱에 준비 신호를 한 번 보낸다.
  앱은 이 신호를 받았을 때만 광고 자리를 보인다. 배너 요소가 생기지 않으면 신호를 보내지 않으며, 앱은 8초 뒤 광고 자리를 지운다.
  배너 코드를 바꾸더라도 이 스크립트는 배너 코드 뒤에 그대로 둔다.
-->
<script>
(function () {
  var sent = false;
  function send() {
    if (sent) return;
    sent = true;
    try { parent.postMessage({ type: 'melody-ad-ready', v: 1 }, '*'); } catch (e) {}
  }
  function watch(el) {
    if (el.getAttribute('data-melody-watched')) return;
    el.setAttribute('data-melody-watched', '1');
    if (el.tagName === 'IMG' && el.complete) {
      if (el.naturalWidth > 0) send();
      return;
    }
    el.addEventListener('load', function () {
      if (el.tagName !== 'IMG' || el.naturalWidth > 0) send();
    });
  }
  function scan() {
    var found = document.body.querySelectorAll('iframe, img');
    for (var i = 0; i < found.length; i++) watch(found[i]);
  }
  scan();
  if (window.MutationObserver) {
    var observer = new MutationObserver(scan);
    observer.observe(document.body, { childList: true, subtree: true });
    setTimeout(function () { observer.disconnect(); }, 8000);
  }
})();
</script>
</body>
</html>
